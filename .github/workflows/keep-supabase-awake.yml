name: Keep Supabase Awake

on:
  schedule:
    # Har 12 hours mein run hoga (6 AM and 6 PM UTC)
    - cron: '0 */12 * * *'
  # Manual run ke liye (GitHub Actions tab se)
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Ping Supabase API
        run: |
          echo "Pinging Supabase to prevent auto-pause..."
          
          # Ping your Supabase project
          curl -X GET "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -w "\nHTTP Status: %{http_code}\n" \
            -o /dev/null -s
          
          echo "✅ Supabase pinged successfully!"
      
      - name: Ping your Vercel/Next.js API (optional)
        run: |
          echo "Pinging your website API to keep it warm..."
          
          # Your Vercel deployment URL
          curl -X GET "https://${{ secrets.VERCEL_URL }}/api/health" \
            -w "\nHTTP Status: %{http_code}\n" \
            -o /dev/null -s || true
      
      - name: Log timestamp
        run: |
          echo "Last ping: $(date -u)"